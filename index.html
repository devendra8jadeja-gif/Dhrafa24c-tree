// ---------- Firebase ----------
var db=null,fbOk=false,HC='979d547a884ae5ae842353d7b1f7540c7956594b4312c3f1bb943de16024498d',HA='df175560be83093257a6f593aa1bfc5a90ae12db125a32f8ced7d21cae916f3b';

// ---------- Tree state (lazy, Firestore-backed) ----------
var live=false,recalcBusy=false; // becomes true once a root document exists in Firestore
var nodes={}; // id -> {id,n,s,pk,ord,pending,f,hasKids}
var childrenOf={}; // parentId -> [id,...] ordered
var openSet={}; // id -> true if expanded
var listeners={}; // id -> unsubscribe fn for that node's children
var rootListenerUnsub=null;
var rootIds=[];
var sel=null,mode=null,err='',delArm=null,msg='',reqOpen=false,pending=[],pendingUnsub=null,importBusy=false;
var localFallback=null; // used only when Firestore has no data yet

function nodeRef(id){return db.collection('people').doc(id);}
function childQuery(pid){return db.collection('people').where('pk','==',pid);}
function tsVal(t){if(t&&typeof t.toMillis==='function'){return t.toMillis();}return typeof t==='number'?t:0;}

function upsertFromSnap(doc){
var d=doc.data();
nodes[doc.id]={id:doc.id,n:d.n,s:d.s,pk:d.pk,ord:d.ord,pending:!!d.pending,f:d.f||'',hasKids:!!d.hasKids,count:typeof d.count==='number'?d.count:0};
}
function attachRootListener(){
if(rootListenerUnsub){return;}
rootListenerUnsub=db.collection('people').where('pk','==','').onSnapshot(function(qs){
var arr=[];
qs.forEach(function(doc){upsertFromSnap(doc);arr.push(doc.id);});
arr.sort(function(x,y){return (nodes[x].ord||0)-(nodes[y].ord||0);});
rootIds=arr;
if(arr.length&&!live){live=true;localFallback=null;}
autoExpandIfNeeded(arr);
maybeAutoRecalc();
render();
},function(e){msg='Could not reach the database. '+(e&&e.message?e.message:'');render();});
}
function attachChildListener(pid){
if(listeners[pid]){return;}
listeners[pid]=childQuery(pid).onSnapshot(function(qs){
var arr=[];
qs.forEach(function(doc){upsertFromSnap(doc);arr.push(doc.id);});
arr.sort(function(x,y){return (nodes[x].ord||0)-(nodes[y].ord||0);});
childrenOf[pid]=arr;
autoExpandIfNeeded(arr);
render();
},function(e){msg='Could not load that branch. '+(e&&e.message?e.message:'');render();});
}
function detachChildListener(pid){
if(listeners[pid]){listeners[pid]();delete listeners[pid];}
}
function detachAllChildListeners(){
Object.keys(listeners).forEach(function(k){listeners[k]();});
listeners={};
}
function attachPendingListener(){
if(pendingUnsub){return;}
pendingUnsub=db.collection('people').where('pending','==',true).onSnapshot(function(qs){
var arr=[];
qs.forEach(function(doc){var d=doc.data();arr.push({id:doc.id,n:d.n,s:d.s,pk:d.pk,f:d.f||'',ts:tsVal(d.ts)});upsertFromSnap(doc);});
arr.sort(function(x,y){return x.ts-y.ts;});

render();
},function(e){msg='Could not load requests. '+(e&&e.message?e.message:'');render();});
}
function detachPendingListener(){
if(pendingUnsub){pendingUnsub();pendingUnsub=null;}
pending=[];
}
var expandAllMode=false;

}

if(!expandAllMode){return;}

}
function reopenTree(){
Object.keys(openSet).forEach(function(id){if(openSet[id]){attachChildListener(id);}});
}
function chainOf(id){
var a=[],cur=nodes[id],guard=0;
while(cur&&guard<80){a.unshift(cur);if(!cur.pk){break;}cur=nodes[cur.pk];guard++;}
return a;
}
function ancestorIdsOf(id,cb){
var ids=[],cur=nodes[id],guard=0;
function step(){
if(!cur||!cur.pk||guard>80){cb(ids);return;}
ids.unshift(cur.pk);
if(nodes[cur.pk]){cur=nodes[cur.pk];guard++;step();}
else{
nodeRef(cur.pk).get().then(function(doc){
if(doc.exists){upsertFromSnap(doc);cur=nodes[cur.pk];guard++;step();}
else{cb(ids);}
}).catch(function(){cb(ids);});
}
}

}
function openPathTo(id){

function midOrd(a,b){
if(a===undefined&&b===undefined){return 1000;}
if(a===undefined){return b-1000;}
if(b===undefined){return a+1000;}

// ---------- Cascade helpers ----------
function fetchAllDescendants(id,acc){
return db.collection('people').where('pk','==',id).get().then(function(qs){
var kids=[];
qs.forEach(function(doc){kids.push(doc.id);acc.push(doc.id);});
return Promise.all(kids.map(function(k){return fetchAllDescendants(k,acc);}));
});
}
function deleteCascade(id){
var acc=[];
return fetchAllDescendants(id,acc).then(function(){
acc.push(id);
var batches=[],i=0;
while(i<acc.length){
var b=db.batch(),chunk=acc.slice(i,i+450);
chunk.forEach(function(x){b.delete(nodeRef(x));});

}

function siblingOrdsNear(pid,idx){
var ids=childrenOf[pid]||[];
var before=idx>0?nodes[ids[idx-1]].ord:undefined;
var after=idx<ids.length?nodes[ids[idx]].ord:undefined;

function submitName(pid,name,status,idx){

function walkUpIncrement(startId,delta){
if(!startId){return;}
var id=startId,guard=0;
function step(){
if(!id||guard>80){return;}
var ref=nodeRef(id);
ref.update({count:firebase.firestore.FieldValue.increment(delta)}).catch(function(){});
var cur=nodes[id];
if(cur){if(typeof cur.count!=='number'){cur.count=0;}cur.count+=delta;}
if(cur&&cur.pk){id=cur.pk;guard++;step();}
else if(cur&&!cur.pk){id=null;}
else{
ref.get().then(function(doc){
if(doc.exists){var d=doc.data();id=d.pk||null;guard++;step();}
else{id=null;}
}).catch(function(){id=null;});
}
}
step();
}
function checkDuplicate(pid,name){

function approveNode(id){

var parent=nodes[n.pk];
if(n.pk&&parent&&parent.pending){msg='Approve its parent first.';render();return;}

if(dup){msg='A name like this already exists here. Rename it first if this is a different person.';render();return;}

});

var n0=nodes[id],dec=(n0&&!n0.pending)?(1+(n0.count||0)):0,parentId=n0?n0.pk:null;
deleteCascade(id).then(function(){
if(dec>0){walkUpIncrement(parentId,-dec);}
if(sel===id){sel=null;}
delArm=null;render();
}).catch(function(){msg='Could not remove it. Try again.';render();});
}else{
delArm=id;render();

}
}

// ---------- Import existing tree (one-time, approver only) ----------
function importSeed(){
if(importBusy){return;}
importBusy=true;render();
var ops=[];
function walk(node,pk,idx){
var ref=db.collection('people').doc();
var kidCounts=(node.c||[]).map(function(c,i){return walk(c,ref.id,i);});
var total=kidCounts.reduce(function(a,b){return a+1+b;},0);
ops.push({ref:ref,data:{n:node.n,n_lower:node.n.toLowerCase(),s:(node.s==='A'||node.s==='D')?node.s:'U',pk:pk,ord:(idx+1)*1000,pending:false,count:total,f:'',hasKids:!!(node.c&&node.c.length)}});
return total;
}
walk(SEED.tree,'',0);
var i=0,batches=[];
while(i<ops.length){
var b=db.batch(),chunk=ops.slice(i,i+450);
chunk.forEach(function(o){b.set(o.ref,o.data);});
batches.push(b.commit());
i+=450;
}
Promise.all(batches).then(function(){
importBusy=false;msg='Imported. The tree is now live.';render();
}).catch(function(){
importBusy=false;msg='Import failed. Check your connection and try again.';render();
});
}

function recalcCounts(silent){
if(recalcBusy||!live||!db){return;}
recalcBusy=true;if(!silent){msg='Recalculating…';render();}
db.collection('people').get().then(function(qs){
var all={};
qs.forEach(function(doc){all[doc.id]=doc.data();});
var kids={};
Object.keys(all).forEach(function(id){var pk=all[id].pk||'';(kids[pk]=kids[pk]||[]).push(id);});
var counts={};
function comp(id){
if(counts.hasOwnProperty(id)){return counts[id];}
if(all[id].pending){counts[id]=0;return 0;}
var list=kids[id]||[],total=0;
list.forEach(function(cid){if(all[cid]&&!all[cid].pending){total+=1+comp(cid);}});
counts[id]=total;
return total;
}
Object.keys(all).forEach(function(id){comp(id);});
var changed=Object.keys(all).filter(function(id){return (all[id].count||0)!==counts[id];});
var i=0,batches=[];
while(i<changed.length){
var b=db.batch(),chunk=changed.slice(i,i+450);
chunk.forEach(function(id){b.update(nodeRef(id),{count:counts[id]});});
batches.push(b.commit());
i+=450;
}
return Promise.all(batches);
}).then(function(){
recalcBusy=false;if(!silent){msg='Counts recalculated.';render();}
}).catch(function(){
recalcBusy=false;if(!silent){msg='Could not recalculate counts. Try again.';render();}
});
}
var recalcDoneThisSession=false;
function maybeAutoRecalc(){
if(role==='a'&&live&&db&&!recalcDoneThisSession){recalcDoneThisSession=true;recalcCounts(true);}
}

function downloadBackup(){
if(!db){return;}
msg='Preparing backup…';render();
db.collection('people').get().then(function(qs){
var arr=[];
qs.forEach(function(doc){
var d=doc.data();
arr.push({id:doc.id,n:d.n,s:d.s,pk:d.pk,ord:d.ord,pending:!!d.pending,count:typeof d.count==='number'?d.count:null,hasKids:!!d.hasKids,f:d.f||'',ts:tsVal(d.ts)});
});
var text=JSON.stringify(arr,null,2);
try{
var b=new Blob([text],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
a.href=u;a.download='family-tree-backup.json';document.body.appendChild(a);a.click();
setTimeout(function(){try{document.body.removeChild(a);URL.revokeObjectURL(u);}catch(e){}},1500);
msg='Backup downloaded.';
}catch(e){msg='Could not create the file. Try a different browser.';}
render();

}

function dist(t){var dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;return Math.sqrt(dx*dx+dy*dy);}
sc0.addEventListener('touchstart',function(e){if(e.touches.length===2){pinch={d:dist(e.touches),z:zoom};}},{passive:true});
sc0.addEventListener('touchmove',function(e){
if(pinch&&e.touches.length===2){e.preventDefault();var cx=(e.touches[0].clientX+e.touches[1].clientX)/2;setZoom(pinch.z*dist(e.touches)/pinch.d,cx);}
},{passive:false});
sc0.addEventListener('touchend',function(e){if(e.touches.length<2){pinch=null;}},{passive:true});
sc0.addEventListener('wheel',function(e){if(e.ctrlKey){e.preventDefault();setZoom(zoom*(e.deltaY<0?1.1:0.9),e.clientX);}},{passive:false});
}

// ---------- Boot ----------
shell();
fromName=lsGet('mft-from')||'';
var r0='v';try{r0=sessionStorage.getItem('mft-role')||'v';}catch(e){}
if(r0!=='a'&&r0!=='c'){r0='v';}
setRole(r0);
fbOk=initFirebase();
if(!fbOk){
live=false;msg='Could not connect to the database. Showing the last saved version.';
render();
}else{
render();
attachRootListener();
if(role==='a'){attachPendingListener();}
initZoomGestures();
// if root check comes back empty after a moment and we're not live, keep offline view (handled in render via `live` flag)
}
})();
